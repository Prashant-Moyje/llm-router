# Groq free tier: no credit card, all models, rate-limited (~30 req/min).
# Sign up at https://console.groq.com -> API Keys.
#
# pricing_basis is "imputed": free-tier inference costs you $0, so the dollar
# figures are Groq's published rates applied to measured token counts. They are
# a model of what this traffic WOULD cost at pay-as-you-go, not a bill. Say so
# in the README. Verify rates at https://groq.com/pricing
#
# ~10x price gap and a real capability gap between 8B and 70B, which is what
# makes this a usable substitute for Haiku-vs-Opus.
seed: 13
test_size: 0.3
sufficiency_margin: 0.0

provider:
  base_url: https://api.groq.com/openai/v1
  api_key_env: GROQ_API_KEY

small:
  name: llama-8b
  model_id: llama-3.1-8b-instant
  input_usd_per_mtok: 0.05
  output_usd_per_mtok: 0.08
  max_tokens: 1024
  supports_temperature: true
  temperature: 0.0
  pricing_basis: imputed

large:
  name: llama-70b
  model_id: llama-3.3-70b-versatile
  input_usd_per_mtok: 0.59
  output_usd_per_mtok: 0.79
  max_tokens: 1024
  supports_temperature: true
  temperature: 0.0
  pricing_basis: imputed

paths: {data: data, artifacts: artifacts, reports: reports}
